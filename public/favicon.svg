<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D96C8A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A94B68;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F4D8DF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8A5B5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer soft ring -->
  <circle cx="32" cy="32" r="31" fill="none" stroke="url(#ring-grad)" stroke-width="2" opacity="0.6"/>
  <!-- Main filled circle -->
  <circle cx="32" cy="32" r="29" fill="url(#bg-grad)"/>

  <!-- Elegant "L" letterform — Playfair-style serif -->
  <text
    x="32"
    y="44"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="34"
    font-weight="700"
    fill="#FFFFFF"
    text-anchor="middle"
    dominant-baseline="auto"
    opacity="0.97"
    letter-spacing="-1"
  >L</text>

  <!-- Small accent dot (acute accent over L for Luméa feel) -->
  <ellipse cx="36.5" cy="15" rx="2.2" ry="1.4" fill="#FFF8FA" opacity="0.75" transform="rotate(-20 36.5 15)"/>
</svg>
